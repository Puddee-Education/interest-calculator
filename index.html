<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interest Calculator</title>
    <!-- Link to external CSS stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <h2>Interest Calculator</h2>
    
    <div class="input-group">
        <label for="principal">Principal Amount ($)</label>
        <input type="number" id="principal" value="1000" min="0">
    </div>
    
    <div class="input-group">
        <label for="rate">Annual Interest Rate (%)</label>
        <input type="number" id="rate" value="5" step="0.1" min="0">
    </div>


    <div class="input-group">
        <label for="startDate">Select Start Date</label>
        <input type="date" id="start-date" name="start-date" min="2000-01-01">
        <script>
            const startDateInput = document.getElementById('start-date')
            startDateInput.addEventListener('change', (e) => {
                console.log("Selected Start Date (YYYY-MM-DD):", e.target.value);
            })
        </script>
    </div>

    <div class="input-group">
        <label for="endDate">Select End Date</label>
        <input type="date" id="end-date" name="end-date" min="2000-01-01">
        <script>
            const endDateInput = document.getElementById('end-date')
            endDateInput.addEventListener('change', (e) => {
                console.log("Selected End Date (YYYY-MM-DD):", e.target.value);
            })
        </script>
    </div>
    
    <!-- Trigger JavaScript function on click -->
    <button id="calcBtn">Calculate</button>
    
    <!-- Initially hide results box-->
    <div class="results" id="resultsBox" style="display: none">
        <div class="result-row">
            <span>Simple Interest Total:</span>
            <span class="result-val" id="simpleTotal">$0.00</span>
        </div>
        <div class="result-row">
            <span>Compound Interest Total:</span>
            <span class="result-val" id="compoundTotal">$0.00</span>
        </div>
    </div>
</div>

<!-- Link to external JS file -->
<script src="app.js"></script>
</body>
</html>
